apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-usuarios-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-usuarios-db
  template:
    metadata:
      labels:
        app: ms-usuarios-db
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_DB
          value: "ms_usuarios_db"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "postgres"
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: ms-usuarios-db
spec:
  selector:
    app: ms-usuarios-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-usuarios-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-usuarios-app
  template:
    metadata:
      labels:
        app: ms-usuarios-app
    spec:
      containers:
      - name: ms-usuarios
        image: mouraaad/ms-usuarios:latest
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://ms-usuarios-db:5432/ms_usuarios_db"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "postgres"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        ports:
        - containerPort: 8092
---
apiVersion: v1
kind: Service
metadata:
  name: ms-usuarios-app
spec:
  type: LoadBalancer
  selector:
    app: ms-usuarios-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-tracking-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-tracking-app
  template:
    metadata:
      labels:
        app: ms-tracking-app
    spec:
      containers:
      - name: ms-tracking
        image: mouraaad/ms-tracking:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8093
---
apiVersion: v1
kind: Service
metadata:
  name: ms-tracking-app
spec:
  type: LoadBalancer
  selector:
    app: ms-tracking-app
  ports:
    - protocol: TCP
      port: 81
      targetPort: 8093
